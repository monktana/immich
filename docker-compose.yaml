#
# Immich – docker-compose.yml für den Betrieb via Coolify
#
# Basiert auf dem offiziellen Compose-File von Immich:
# https://github.com/immich-app/immich/blob/main/docker/docker-compose.yml
#
# Angepasst analog zum Paperless-Setup (monktana/paperless):
#  - Keine .env Datei, alle Variablen werden direkt in Coolify unter
#    "Environment Variables" hinterlegt (siehe README für die Liste).
#  - Bind-Mounts auf ein separates Hetzner Volume statt Docker-verwalteter
#    Named Volumes, damit die Fotobibliothek nicht auf der System-Disk liegt.
#  - Kein Port-Mapping, Coolify übernimmt Reverse Proxy + TLS über die
#    Domain-Konfiguration der Resource.
#
# WICHTIG: Vor größeren Upgrades die Release Notes prüfen:
# https://github.com/immich-app/immich/releases
#

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - /mnt/app-data/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
      TZ: ${TZ}
    expose:
      - '2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # Für Hardware-Beschleunigung (nicht relevant auf Hetzner Cloud ohne GPU):
    # Image-Tag um -[armnn, cuda, rocm, openvino, rknn] ergänzen.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Falls die DB NICHT auf SSD/NVMe liegt, die nächste Zeile aktivieren:
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - /mnt/app-data/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  # ML-Modell-Cache, unkritisch (wird bei Bedarf einfach neu heruntergeladen),
  # bleibt daher als Docker-verwaltetes Volume statt Bind-Mount.
  model-cache:
