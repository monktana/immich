#
# Immich – docker-compose.yml für den Betrieb via Coolify
#
# Basiert auf dem offiziellen Compose-File von Immich:
# https://github.com/immich-app/immich/blob/main/docker/docker-compose.yml
#
# Änderungen ggü. dem Original:
#  - kein `ports:` Mapping mehr auf dem immich-server, stattdessen `expose`,
#    damit Coolify/Traefik den Reverse Proxy + Let's Encrypt übernimmt
#    (genau wie bei paperless). Domain wird in Coolify konfiguriert.
#  - Kommentare an ein paar Stellen ergänzt/eingedeutscht
#
# WICHTIG: Immer die aktuelle Version von hier prüfen, bevor größere Upgrades
# gemacht werden: https://github.com/immich-app/immich/releases
#

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Nicht die nächste Zeile ändern. Speicherort wird über UPLOAD_LOCATION
      # in der .env gesteuert (siehe .env.example -> am besten ein separates
      # Hetzner Volume hier einhängen, nicht die System-Disk!)
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    # Coolify übernimmt den Reverse Proxy + TLS, daher kein Port-Mapping nach
    # außen. Falls du OHNE Coolify direkt per Port testen willst, ersetze
    # `expose` durch:
    #   ports:
    #     - '2283:2283'
    expose:
      - '2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # Für Hardware-Beschleunigung (nicht relevant auf Hetzner Cloud ohne GPU):
    # Image-Tag um -[armnn, cuda, rocm, openvino, rknn] ergänzen.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Falls die DB NICHT auf SSD/NVMe liegt, die nächste Zeile aktivieren:
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Speicherort wird über DB_DATA_LOCATION in der .env gesteuert.
      # Muss auf EXT4/XFS/ZFS/BTRFS liegen, NICHT auf einem Netzwerk-Share.
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
